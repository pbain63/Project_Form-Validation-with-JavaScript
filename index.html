<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation with JavaScript</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="form-page">
      <!-- Form -->
      <form id="signup-form" novalidate>
        <h1>Required fields are followed by "*"</h1>

        <div class="form-container">
          <!-- Left side -->
          <div class="form-left-side">
            <!-- Name -->
            <div class="form-group">
              <label for="name"> Name * </label>

              <input type="text" id="name" name="name" required />

              <span
                class="error-message"
                id="name-error"
                aria-live="polite"
              ></span>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="password"> Password * </label>

              <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
              />

              <span
                class="error-message"
                id="password-error"
                aria-live="polite"
              ></span>
            </div>

            <!-- Password confirmation -->
            <div class="form-group">
              <label for="confirm-password"> Password Confirmation * </label>

              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                required
              />

              <span
                class="error-message"
                id="confirm-password-error"
                aria-live="polite"
              ></span>
            </div>
          </div>

          <!-- Right side -->
          <div class="form-right-side">
            <!-- Email -->
            <div class="form-group">
              <label for="mail"> Email * </label>

              <input
                type="email"
                id="mail"
                name="mail"
                required
                minlength="6"
              />

              <span
                class="error-message"
                id="email-error"
                aria-live="polite"
              ></span>
            </div>

            <!-- Country -->
            <div class="form-group">
              <label for="country"> Country * </label>

              <select id="country" name="country" required>
                <option value="ch">Switzerland</option>

                <option value="fr">France</option>

                <option value="de">Germany</option>

                <option value="nl">The Netherlands</option>

                <option value="bd">Bangladesh</option>
              </select>
            </div>

            <!-- Postal code -->
            <div class="form-group">
              <label for="postal-code"> Postal Code * </label>

              <input type="text" id="postal-code" name="postal-code" required />

              <span
                class="error-message"
                id="postal-code-error"
                aria-live="polite"
              ></span>
            </div>
          </div>
        </div>

        <button class="submit-button" type="submit">Submit</button>
      </form>

      <!-- Success message -->
      <section class="success-message" aria-live="polite" hidden>
        <h2>Form submitted successfully!</h2>

        <p>
          Thank you,
          <span class="user-name"></span>.
        </p>

        <button type="button" class="back-to-form">Back to Form</button>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
